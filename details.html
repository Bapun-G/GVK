<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mark Attendance</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<div class="app">


    <div class="logo-box">
        <img src="images/logo.png" alt="Logo">
    </div>


    <h2>Employee Attendance</h2>


    <div class="card">

        <p>
            <b>Employee ID:</b>
            <span id="showGid"></span>
        </p>


        <label>
            Vehicle Code:
        </label>
        <label>
          MunigudaBlockOffice288
        </label>


        <input 
        type="text" 
        id="empName"
        placeholder="Enter Employee Name">


        <p class="info">
            Date:
            <span id="date"></span>
        </p>


        <p class="info">
            Time:
            <span id="time"></span>
        </p>


        <button onclick="markAttendance()">
            MARK ATTENDANCE
        </button>


        <h3 id="success"></h3>


    </div>


</div>


<script src="app.js"></script>

</body>
</html>
